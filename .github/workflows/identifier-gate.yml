name: identifier-gate
on: [push, pull_request]
jobs:
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the message scan needs history, not a shallow clone
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fail closed if a public repo has no denylist configured
        env:
          DENYLIST: ${{ secrets.TOUCHSTONE_FORBIDDEN_IDENTIFIERS }}
        run: |
          declared=$(python3 -c '
          import pathlib, tomllib
          p = pathlib.Path("publication.toml")
          if not p.is_file():
              print("unknown")
          else:
              try:
                  data = tomllib.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  print("unparseable")
              else:
                  print(data.get("publication", {}).get("visibility", "unknown"))
          ')
          echo "declared visibility: $declared"
          if [ "$declared" = "public" ] && [ -z "${DENYLIST//[[:space:]]/}" ]; then
            echo "::error::publication.toml declares visibility=public but the denylist secret is unset — the identifier gate would silently pass. Configure it."
            exit 1
          fi
      - name: Check for committed work-domain identifiers
        env:
          TOUCHSTONE_FORBIDDEN_IDENTIFIERS: ${{ secrets.TOUCHSTONE_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py
      # Everything the push or PR publishes, not just the tip tree: every commit's
      # message, author/committer identity, and added or changed files. The range
      # comes from the event (needs the fetch-depth: 0 checkout above).
      - name: Published-range identifier gate
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          TOUCHSTONE_FORBIDDEN_IDENTIFIERS: ${{ secrets.TOUCHSTONE_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py --ci-range
