name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: touchstone
          POSTGRES_PASSWORD: touchstone
          POSTGRES_DB: touchstone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U touchstone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # conftest uses this instead of starting its own container. Without it the
      # suite would try to run docker inside the runner.
      TOUCHSTONE_TEST_DSN: postgresql+psycopg://touchstone:touchstone@127.0.0.1:5432/touchstone_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Migrations apply to an empty database
        # A green test suite runs against metadata.create_all; it says nothing
        # about whether the migrations that build production actually work.
        env:
          TOUCHSTONE_DSN: postgresql+psycopg://touchstone:touchstone@127.0.0.1:5432/touchstone_migr
        run: |
          PGPASSWORD=touchstone psql -h 127.0.0.1 -U touchstone -d postgres \
            -c "CREATE DATABASE touchstone_migr"
          alembic upgrade head

      - name: Migrations match the models (no drift)
        env:
          TOUCHSTONE_DSN: postgresql+psycopg://touchstone:touchstone@127.0.0.1:5432/touchstone_migr
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id driftcheck
          if grep -qE 'op\.(create|add|drop|alter)' migrations/versions/driftcheck_*.py; then
            echo "::error::models and migrations have drifted — regenerate the migration"
            cat migrations/versions/driftcheck_*.py
            exit 1
          fi
          echo "no drift"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hraedon/touchstone
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: touchstone-ci:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test under production container constraints
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name touchstone-sink-smoke \
            --read-only --user 65532:65532 --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --publish 127.0.0.1:18080:8080 \
            --env TOUCHSTONE_DSN=postgresql+psycopg://unused:unused@db.invalid/touchstone \
            --env VERIFICATION_TOKEN=vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv \
            --env ENDPOINT_URL=https://ebdel.hraedon.com/ \
            --env EBAY_CLIENT_ID=ci-placeholder \
            --env EBAY_CLIENT_SECRET=ci-placeholder \
            touchstone-ci:smoke
          trap 'docker rm --force touchstone-sink-smoke >/dev/null 2>&1' EXIT

          expected='{"challengeResponse":"32af18f06a992bbfcbfadf680f993e1a1f2184a014877584588e3c36d9b999f8"}'
          response=''
          for _ in {1..30}; do
            response=$(curl --fail --silent --show-error \
              'http://127.0.0.1:18080/?challenge_code=ci-smoke') && break
            sleep 1
          done
          test "$response" = "$expected"
          test "$(curl --fail --silent http://127.0.0.1:18080/healthz)" = \
            '{"status":"ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/docs)" = '404'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested source revision
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
