apiVersion: apps/v1
kind: Deployment
metadata:
  name: touchstone-sink
  namespace: touchstone
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: touchstone-sink
  template:
    metadata:
      labels:
        app: touchstone-sink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The migration init container lives here and nowhere else. Every other
      # workload assumes the schema is current: two workloads racing to run
      # `alembic upgrade head` on one database during a simultaneous rollout is a
      # deadlock waiting for a bad day.
      initContainers:
        - name: migrate
          image: ghcr.io/hraedon/touchstone@sha256:e209860b26472b797f06887c8ef754c29ad19c0122f5a55681af542ad4f3b4d2
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: TOUCHSTONE_DSN
              valueFrom:
                secretKeyRef:
                  name: touchstone-db-secrets
                  key: TOUCHSTONE_DSN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: sink
          image: ghcr.io/hraedon/touchstone@sha256:e209860b26472b797f06887c8ef754c29ad19c0122f5a55681af542ad4f3b4d2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TOUCHSTONE_DSN
              valueFrom:
                secretKeyRef:
                  name: touchstone-db-secrets
                  key: TOUCHSTONE_DSN
            - name: VERIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: touchstone-sink-secrets
                  key: VERIFICATION_TOKEN
            - name: ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: touchstone-sink-secrets
                  key: ENDPOINT_URL
            - name: EBAY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: touchstone-ebay-secrets
                  key: EBAY_CLIENT_ID
            - name: EBAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: touchstone-ebay-secrets
                  key: EBAY_CLIENT_SECRET
          # Keep serving for a few seconds after Kubernetes marks the pod for
          # deletion. Endpoint removal and container shutdown race: the ingress
          # controller learns about the termination asynchronously, so without this
          # a rolling update briefly routes to a pod that has already stopped
          # listening. Observed during the Plan 004 rollout as a Bad Gateway on the
          # sink's external route — brief, and eBay retries, but the callback going
          # 502 is not something to leave to luck on a compliance endpoint.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
